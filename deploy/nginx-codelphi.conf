# app.codelphi.com → 本机 gateway 容器（127.0.0.1:18080；8080/8081 等低端口留给既有服务）。
# 安装：cp deploy/nginx-codelphi.conf /etc/nginx/conf.d/codelphi.conf && nginx -t && systemctl reload nginx
# 证书：certbot --nginx -d app.codelphi.com（复用机器上既有 LE 账户；自动续期由 certbot timer + deploy hook 负责）
server {
    listen 80;
    server_name app.codelphi.com;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # 长轮询/材料上传余量
        client_max_body_size 100m; # 章材料上传
    }
}
